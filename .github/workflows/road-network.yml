name: Build road network

# Downloads the expressway/trunk road network for Peninsular Malaysia from
# OpenStreetMap (scripts/build_road_network.py) and commits it as
# app/road_network.json.gz, which the app loads before anything else. Without
# it, every restart — and Render's free disk does not survive one — downloads
# the network from the public Overpass servers again, and those time out often.
#
# Manual only. Expressways change rarely, so rerun it when one opens. It
# commits to the branch it is run on; merge or fast-forward that into the
# default branch as usual (a push made with this workflow's own token does
# not trigger the Render deploy workflow).

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install httpx==0.27.0
      - name: Build the network
        run: python scripts/build_road_network.py
      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/road_network.json.gz
          if git diff --cached --quiet; then
            echo "Network unchanged; nothing to commit."
          else
            git commit -m "Update bundled road network ($(date -u +%Y-%m-%d))"
            git push
          fi
